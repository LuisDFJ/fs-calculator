name: calculator-app

services:
  backend:
    build:
      context: ./backend
    container_name: server-api
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      ALLOWED_ORIGINS: http://localhost,http://localhost:80

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SERVER_API_URL: http://localhost:8080
    container_name: calculator-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

